<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#2a0c0a"/>
      <stop offset="0.55" stop-color="#120707"/>
      <stop offset="1" stop-color="#050303"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="16" fill="url(#bg)" stroke="#4a100c" stroke-width="4"/>
  <!-- steam rising behind the wheel -->
  <g fill="#8a7a74" opacity="0.16" filter="url(#soft)">
    <circle cx="34" cy="30" r="12"/><circle cx="46" cy="20" r="9"/><circle cx="92" cy="26" r="11"/>
  </g>
  <!-- valve hand wheel -->
  <g transform="rotate(18 64 64)" stroke-linecap="round">
    <circle cx="64" cy="64" r="40" fill="none" stroke="#7a0c0a" stroke-width="11"/>
    <circle cx="64" cy="64" r="40" fill="none" stroke="#e0281d" stroke-width="3" opacity="0.75"/>
    <line x1="64" y1="24" x2="64" y2="104" stroke="#7a0c0a" stroke-width="7"/>
    <line x1="24" y1="64" x2="104" y2="64" stroke="#7a0c0a" stroke-width="7"/>
    <line x1="64" y1="24" x2="64" y2="104" stroke="#c4201a" stroke-width="2" opacity="0.7"/>
    <line x1="24" y1="64" x2="104" y2="64" stroke="#c4201a" stroke-width="2" opacity="0.7"/>
  </g>
  <!-- hub with the foreman's eyes -->
  <circle cx="64" cy="64" r="17" fill="#0b0404" stroke="#7a0c0a" stroke-width="4"/>
  <g filter="url(#glow)" fill="#ff3524">
    <ellipse cx="58" cy="63" rx="4" ry="2.4" transform="rotate(-8 58 63)"/>
    <ellipse cx="70" cy="63" rx="4" ry="2.4" transform="rotate(8 70 63)"/>
  </g>
</svg>
